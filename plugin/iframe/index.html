        default: return "待处理";
      }
    }

    function formatStepEntryLine(entry) {
      if (!entry || !entry.kind) return "";
      if (entry.kind === "task") return `任务: ${entry.text || ""}`;
      if (entry.kind === "thought") return `思考: ${entry.text || ""}`;
      if (entry.kind === "tool_call") return `Tool: ${entry.title || "工具调用"}${entry.meta ? ` ${entry.meta}` : ""}`;
      if (entry.kind === "observation") return `观察: ${entry.text || ""}`;
      if (entry.kind === "final") return `完成: ${entry.text || ""}`;
      return entry.text || "";
    }

    function normalizeStepKind(stepKind) {
      if (
        stepKind === "context" ||
        stepKind === "mcp" ||
        stepKind === "rules" ||
        stepKind === "library" ||
        stepKind === "llm" ||
        stepKind === "draft"
      ) {
        return stepKind;
      }
      return "unknown";
    }

    function getReactEventsForStepKind(stepKind, reactEvents) {
      const list = Array.isArray(reactEvents) ? reactEvents : [];
      const normalized = normalizeStepKind(stepKind);
      const matched = list.filter((event) => event && event.stepKind === normalized);
      if (matched.length > 0) return matched;

      // Best-effort fallback for older payloads without stepKind. Keep it conservative.
      if (normalized === "llm") {
        return list.filter((event) => event && event.kind === "tool_call" && event.toolName === "llm_generate");
      }
      return [];
    }

    function formatDetailKind(kind) {
      switch (kind) {
        case "task": return "任务";
        case "thought": return "思考";
        case "tool_call": return "工具";
        case "observation": return "观察";
        case "final": return "完成";
        default: return "记录";
      }
    }

    function formatDetailText(event) {
      if (!event || !event.kind) return "";
      if (event.kind === "tool_call") {
        const tool = event.label || event.toolName || "工具调用";
        const meta = event.inputSummary ? ` (${event.inputSummary})` : "";
        return `${tool}${meta}${event.text ? `: ${event.text}` : ""}`.trim();
      }
      if (event.kind === "observation") {
        return (event.outputSummary || event.text || "").trim();
      }
      return (event.text || event.label || "").trim();
    }

    function summarizeExecutionText(kind, text, title) {
      const raw = String(text || "").trim();
      if (!raw) return "";
      if (kind === "thought") {
        return raw.length > 90 ? `${raw.slice(0, 90)}…` : raw;
      }
      const looksLikeJson = raw.startsWith("{") || raw.startsWith("[");
      const label = String(title || "").trim().toLowerCase();
      if (kind === "tool_call") {
        if (label.includes("editor_get_current_context")) return "正在读取当前原理图上下文";
        if (label.includes("rules_run_schematic_checks")) return "正在执行规则检查";
        if (label.includes("schematic_review")) return "正在拉取网表级证据";
        if (label.includes("schematic_build_analysis_evidence")) return "正在整理分析证据";
        if (label.includes("todo_list")) return "正在更新执行步骤";
        if (looksLikeJson) return "正在调用工具处理当前步骤";
        return raw.length > 80 ? `${raw.slice(0, 80)}…` : raw;
      }
      if (kind === "observation") {
        if (looksLikeJson) {
          if (/\"issues?\"/i.test(raw)) return "规则检查已完成，正在整理问题";
          if (/\"found\"/i.test(raw) || /\"objectId\"/i.test(raw)) return "已找到关联对象";
          if (/\"action\"/i.test(raw) && /\"tasks\"/i.test(raw)) return "执行步骤已同步";
          if (/\"stats\"/i.test(raw) || /\"summary\"/i.test(raw)) return "已拿到统计摘要";
          if (/\"components\"/i.test(raw) || /\"nets\"/i.test(raw)) return "原理图上下文已就绪";
          return "工具结果已返回";
        }
        return raw.length > 110 ? `${raw.slice(0, 110)}…` : raw;
      }
      return raw.length > 120 ? `${raw.slice(0, 120)}…` : raw;
    }

    function simpleEnsureStepsUI(dom, defaultOpen) {
      if (dom.stepsUI) return dom.stepsUI;
      if (!dom.stepsHostEl || !dom.stepsToggleHostEl) return null;

      dom.stepsHostEl.innerHTML = "";
      const body = document.createElement("div");
      body.className = "assistant-steps-content assistant-steps-timeline";
      dom.stepsHostEl.appendChild(body);

        const ui = {
          host: dom.stepsHostEl,
          body,
          btn: dom.stepsToggleHostEl,
          open: Boolean(defaultOpen),
          streaming: Boolean(defaultOpen),
        userToggled: false,
          reactLen: 0,
          lines: [],
          events: [],
          expanded: Object.create(null), // stepKind -> boolean
          statusMemory: Object.create(null), // stepKey -> status
          runtimeMemory: Object.create(null), // stepKey -> startedAt
        };

       ui.btn.addEventListener("click", () => {
         ui.open = !ui.open;
         ui.userToggled = true;
         renderStepsUI(ui);
       });

      dom.stepsUI = ui;
      renderStepsUI(ui);
      return ui;
    }

    function getTimelineEntryKey(entry, index) {
      if (entry && entry.isSummary) return "summary:thought";
      if (entry && entry.stepKind) return `step:${entry.stepKind}`;
      if (entry && entry.kind === "tool_call") return `tool:${entry.title || entry.text || index}`;
      if (entry && entry.kind === "observation") return `observation:${entry.title || entry.text || index}`;
      if (entry && entry.kind === "final") return `final:${entry.title || entry.text || index}`;
      if (entry && entry.kind === "task") return `task:${entry.title || entry.text || index}`;
      return `entry:${index}`;
    }

    function renderStepsUI(ui) {
      const hasLines = ui.lines.length > 0;
      const rawEntries = Array.isArray(ui.events) && ui.events.length > 0
        ? ui.events
        : ui.lines.map(parseTimelineEntry);
      // Keep exact append order from the runtime: older entries on top, newest entries at bottom.
      const entries = Array.isArray(rawEntries) ? rawEntries.slice() : [];
      ui.body.innerHTML = "";
      entries.forEach((entry) => {
        ui.body.appendChild(buildTimelineNode(entry, ui));
      });
      if (ui.streaming) {
        requestAnimationFrame(() => {
          ui.body.scrollTop = ui.body.scrollHeight;
          const lastNode = ui.body.lastElementChild;
          if (lastNode && typeof lastNode.scrollIntoView === "function") {
            lastNode.scrollIntoView({ block: "end" });
          }
        });
      }
      if (ui.streaming) {
        ui.open = true;
        ui.host.hidden = !hasLines;
        ui.btn.style.display = "none";
      } else {
        ui.host.hidden = !hasLines || !ui.open;
        ui.btn.style.display = hasLines ? "inline-flex" : "none";
      }
      ui.btn.textContent = "执行过程";
      ui.btn.setAttribute("data-open", hasLines && ui.open ? "true" : "false");
    }

    function formatRunningElapsed(startedAt) {
      const started = Number(startedAt || 0);
      if (!started || !Number.isFinite(started)) return "0s";
      const seconds = Math.max(0, Math.floor((Date.now() - started) / 1000));
      if (seconds < 60) return `${seconds}s`;
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins}m ${secs}s`;
    }

    function parseTimelineEntry(line) {
      const text = String(line || "").trim();
      const match = text.match(/^(Tool|任务|思考|观察|完成):\s*(.*)$/);
      if (!match) {
        return { kind: "observation", status: "pending", title: "记录", text };
      }
      const rawKind = match[1];
      const content = match[2] || "";
      if (rawKind === "Tool") {
        const toolMatch = content.match(/^([^\s]+)(?:\s+(.*))?$/);
        return {
          kind: "tool_call",
          status: "pending",
          title: toolMatch?.[1] || "工具调用",
          meta: toolMatch?.[2] || "",
          text: "",
        };
      }
      const kindMap = {
        "任务": "task",
        "思考": "thought",
        "观察": "observation",
        "完成": "final",
      };
      return {
        kind: kindMap[rawKind] || "observation",
        status: rawKind === "完成" ? "done" : "pending",
        title: "",
        text: content,
      };
    }

    function buildTimelineNode(entry, ui) {
      const node = document.createElement("div");
      node.className = "assistant-step-node";

      const marker = document.createElement("div");
      const statusClass = normalizeTimelineStatus(entry && entry.status);
      const stepKey = String(entry && (entry.stepKind || entry.title || entry.kind || ""));
      const previousStatus = stepKey && ui && ui.statusMemory ? ui.statusMemory[stepKey] : undefined;
      const isRecentlyDone = previousStatus === "running" && statusClass === "done";
      if (stepKey && ui && ui.runtimeMemory) {
        if (statusClass === "running") {
          if (!ui.runtimeMemory[stepKey]) {
            ui.runtimeMemory[stepKey] = Date.now();
          }
        } else if (ui.runtimeMemory[stepKey]) {
          delete ui.runtimeMemory[stepKey];
        }
      }
      marker.className = `assistant-step-marker ${entry.kind || "observation"} ${statusClass}${isRecentlyDone ? " recently-done" : ""}`;
      node.appendChild(marker);

      const card = document.createElement("div");
      card.className = `assistant-step-card ${entry.kind || "observation"} ${statusClass}${isRecentlyDone ? " recently-done" : ""}`;

      const headline = document.createElement("div");
      headline.className = "assistant-step-headline";

      const kind = document.createElement("span");
      kind.className = "assistant-step-kind";
      kind.textContent = formatTimelineKind(entry.kind);
      headline.appendChild(kind);

      const title = document.createElement("span");
      title.className = "assistant-step-title";
      title.textContent = entry.title || formatTimelineKind(entry.kind);
      headline.appendChild(title);

      const state = document.createElement("span");
      state.className = `assistant-step-state ${statusClass}${isRecentlyDone ? " recently-done" : ""}`;
      state.textContent = formatTimelineStatus(entry && entry.status);
      headline.appendChild(state);

      if (entry && entry.isSummary) {
        const badge = document.createElement("span");
        badge.className = "assistant-step-badge";
        badge.textContent = "摘要";
        headline.appendChild(badge);
      }

      if (entry.meta) {
        const meta = document.createElement("span");
        meta.className = "assistant-step-meta";
        meta.textContent = entry.meta;
        headline.appendChild(meta);
      }

      if (statusClass === "running") {
        const runtime = document.createElement("span");
        runtime.className = "assistant-step-runtime";
        const runtimeLabel = entry && entry.details && entry.details.length > 0
          ? (() => {
              const toolEvent = entry.details.find((event) => event && event.kind === "tool_call");
              return toolEvent ? String(toolEvent.label || toolEvent.toolName || toolEvent.text || "").trim() : "";
            })()
          : "";
        const elapsed = stepKey && ui && ui.runtimeMemory ? formatRunningElapsed(ui.runtimeMemory[stepKey]) : "0s";
        runtime.textContent = runtimeLabel ? `${runtimeLabel} · ${elapsed}` : elapsed;
        headline.appendChild(runtime);
      }

      card.appendChild(headline);

      if (entry.text) {
        const text = document.createElement("div");
        const statusForText = normalizeTimelineStatus(entry && entry.status);
        const compactClass = " compact";
        text.className = `assistant-step-text${entry && entry.isSummary ? " summary" : ""}${compactClass}`;
        text.textContent = summarizeExecutionText(entry.kind, entry.text, entry.title || "");
        card.appendChild(text);
      }

      const detailEvents = entry && Array.isArray(entry.details)
        ? entry.details.filter((event) => event && event.kind !== "thought")
        : [];
      const shouldRenderDetails =
        Boolean(entry && entry.stepKind) &&
        !Boolean(entry && entry.isSummary) &&
        detailEvents.length > 0 &&
        normalizeTimelineStatus(entry && entry.status) === "failed";
      if (shouldRenderDetails) {
        const status = normalizeTimelineStatus(entry.status);
        const defaultOpen = status === "running" || status === "failed";
        const open = Boolean(ui && ui.expanded && Object.prototype.hasOwnProperty.call(ui.expanded, stepKey) ? ui.expanded[stepKey] : defaultOpen);
        if (ui && ui.expanded && (status === "running" || status === "failed") && !Object.prototype.hasOwnProperty.call(ui.expanded, stepKey)) {
          ui.expanded[stepKey] = true;
        }
        if (ui && ui.expanded && status === "done" && !Object.prototype.hasOwnProperty.call(ui.expanded, stepKey)) {
          ui.expanded[stepKey] = false;
        }

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "assistant-step-detail-toggle";
        btn.textContent = `详情 ${detailEvents.length}`;
        btn.setAttribute("data-open", open ? "true" : "false");

        const details = document.createElement("div");
        details.className = "assistant-step-details";
        details.hidden = !open;
        detailEvents.forEach((event) => {
          const item = document.createElement("div");
          item.className = "assistant-step-detail-item";
          const pill = document.createElement("div");
          pill.className = "assistant-step-detail-pill";
          pill.textContent = formatDetailKind(event.kind);
          const body = document.createElement("div");
          body.className = "assistant-step-detail-text";
          body.textContent = formatDetailText(event);
          item.appendChild(pill);
          item.appendChild(body);
          details.appendChild(item);
        });

        btn.addEventListener("click", () => {
          const willOpen = details.hidden;
          details.hidden = !willOpen;
          if (ui && ui.expanded) {
            ui.expanded[stepKey] = willOpen;
          }
          btn.setAttribute("data-open", willOpen ? "true" : "false");
        });

        card.appendChild(btn);
        card.appendChild(details);
      }

      if (stepKey && ui && ui.statusMemory) {
        ui.statusMemory[stepKey] = statusClass;
      }

      node.appendChild(card);
      return node;
    }

    function formatTimelineKind(kind) {
      switch (kind) {
        case "task": return "任务";
        case "thought": return "思考";
        case "tool_call": return "工具";
        case "observation": return "观察";
        case "final": return "完成";
        default: return "记录";
      }
    }

    function normalizeTimelineStatus(status) {
      switch (status) {
        case "running":
        case "done":
        case "failed":
        case "skipped":
          return status;
        default:
          return "pending";
      }
    }

    function formatTimelineStatus(status) {
      switch (normalizeTimelineStatus(status)) {
        case "running": return "进行中";
        case "done": return "已完成";
        case "failed": return "失败";
        case "skipped": return "已跳过";
        default: return "待执行";
      }
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function renderMarkdown(text) {
      const raw = String(text || "").replace(/\r\n/g, "\n");
      const lines = raw.split("\n");
      const blocks = [];
      let i = 0;

      const pushParagraph = (content) => {
        const trimmed = String(content || "").trim();
        if (!trimmed) return;
        blocks.push("<p>" + renderInlineMarkdown(trimmed) + "</p>");
      };

      while (i < lines.length) {
        const line = lines[i];
        if (!line || !line.trim()) {
          i += 1;
          continue;
        }

        // Fenced code block
        if (/^```/.test(line.trim())) {
          const fence = line.trim();
          const lang = fence.slice(3).trim();
          i += 1;
          const codeLines = [];
          while (i < lines.length && !/^```/.test(lines[i].trim())) {
            codeLines.push(lines[i]);
            i += 1;
          }
          if (i < lines.length && /^```/.test(lines[i].trim())) {
            i += 1;
          }
          const className = lang ? ` class="language-${escapeHtml(lang)}"` : "";
          blocks.push(`<pre><code${className}>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
          continue;
        }

        // Horizontal rule
        if (/^(\*\s*\*\s*\*|-{3,}|_{3,})$/.test(line.trim())) {
          blocks.push("<hr>");
          i += 1;
          continue;
        }

        // Headings
        const headingMatch = line.trim().match(/^(#{1,6})\s+(.+)$/);
        if (headingMatch) {
          const level = Math.min(headingMatch[1].length, 6);
          blocks.push(`<h${level}>` + renderInlineMarkdown(headingMatch[2]) + `</h${level}>`);
          i += 1;
          continue;
        }

        // Blockquote
        if (/^>\s?/.test(line.trim())) {
          const quoteLines = [];
          while (i < lines.length && /^>\s?/.test(lines[i].trim())) {
            quoteLines.push(lines[i].trim().replace(/^>\s?/, ""));
            i += 1;
          }
          blocks.push("<blockquote>" + renderMarkdown(quoteLines.join("\n")) + "</blockquote>");
          continue;
        }

        // Markdown table (very small subset):
        // | A | B |
        // |---|---|
        // |...|...|
        if (line.trim().startsWith("|") && i + 1 < lines.length && /^\s*\|?\s*[-:]+/.test(lines[i + 1].trim())) {
          const header = splitTableRow(line);
          i += 2; // skip header + separator
          const rows = [];
          while (i < lines.length && lines[i] && lines[i].trim().startsWith("|")) {
            rows.push(splitTableRow(lines[i]));
            i += 1;
          }
          const colCount = Math.max(header.length, ...rows.map((r) => r.length), 1);
          const ths = header
            .concat(Array(Math.max(0, colCount - header.length)).fill(""))
            .map((cell) => "<th>" + renderInlineMarkdown(cell) + "</th>")
            .join("");
          const trs = rows
            .map((row) => {
              const tds = row
                .concat(Array(Math.max(0, colCount - row.length)).fill(""))
                .map((cell) => "<td>" + renderInlineMarkdown(cell) + "</td>")
                .join("");
              return "<tr>" + tds + "</tr>";
            })
            .join("");
          blocks.push(
            '<div class="md-table-wrap"><table class="md-table"><thead><tr>' +
              ths +
              "</tr></thead><tbody>" +
              trs +
              "</tbody></table></div>"
          );
          continue;
        }

        // Unordered list
        if (/^[-*]\s+/.test(line.trim())) {
          const items = [];
          while (i < lines.length && /^[-*]\s+/.test(lines[i].trim())) {
            items.push("<li>" + renderInlineMarkdown(lines[i].trim().replace(/^[-*]\s+/, "")) + "</li>");
            i += 1;
          }
          blocks.push("<ul>" + items.join("") + "</ul>");
          continue;
        }

        // Ordered list
        if (/^\d+\.\s+/.test(line.trim())) {
          const items = [];
          while (i < lines.length && /^\d+\.\s+/.test(lines[i].trim())) {
            items.push("<li>" + renderInlineMarkdown(lines[i].trim().replace(/^\d+\.\s+/, "")) + "</li>");
            i += 1;
          }
          blocks.push("<ol>" + items.join("") + "</ol>");
          continue;
        }

        // Paragraph: merge consecutive non-empty, non-list lines.
        const para = [];
        while (
          i < lines.length &&
          lines[i] &&
          lines[i].trim() &&
          !/^```/.test(lines[i].trim()) &&
          !/^(\*\s*\*\s*\*|-{3,}|_{3,})$/.test(lines[i].trim()) &&
          !/^(#{1,6})\s+(.+)$/.test(lines[i].trim()) &&
          !/^>\s?/.test(lines[i].trim()) &&
          !(lines[i].trim().startsWith("|") && i + 1 < lines.length && /^\s*\|?\s*[-:]+/.test(lines[i + 1].trim())) &&
          !/^[-*]\s+/.test(lines[i].trim()) &&
          !/^\d+\.\s+/.test(lines[i].trim())
        ) {
          para.push(lines[i].trim());
          i += 1;
        }
        pushParagraph(para.join(" "));
      }

      return blocks.join("");
    }

    function splitTableRow(line) {
      const raw = String(line || "").trim();
      const trimmed = raw.replace(/^\|/, "").replace(/\|$/, "");
      return trimmed.split("|").map((cell) => String(cell || "").trim());
    }

    function renderInlineMarkdown(text) {
      const placeholders = [];
      let s = escapeHtml(String(text || ""));

      s = s.replace(/`([^`]+)`/g, (_, code) => {
        const token = `__INLINE_CODE_${placeholders.length}__`;
        placeholders.push(`<code>${code}</code>`);
        return token;
      });

      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/(^|[^\*])\*([^*]+)\*(?!\*)/g, "$1<em>$2</em>");

      s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, label, href) => {
        return `<a href="${escapeHtml(href)}" target="_blank" rel="noreferrer noopener">${label}</a>`;
      });

      placeholders.forEach((html, index) => {
        s = s.replace(`__INLINE_CODE_${index}__`, html);
      });
      return s;
    }

    function buildStructuredSignature(blocks) {
      // Cheap stable signature to avoid re-rendering DOM on every state sync.
      const parts = [];
      (blocks || []).forEach((b) => {
        if (!b || !b.kind) return;
        if (b.kind === "paragraph") {
          parts.push(`p:${String(b.text || "").length}`);
        } else if (b.kind === "section") {
          parts.push(`s:${String(b.title || "").length}:${String(b.text || "").length}`);
        } else if (b.kind === "list") {
          const n = Array.isArray(b.items) ? b.items.length : 0;
          parts.push(`l:${String(b.title || "").length}:${n}`);
        } else if (b.kind === "kv") {
          const n = Array.isArray(b.entries) ? b.entries.length : 0;
          parts.push(`k:${String(b.title || "").length}:${n}`);
        } else {
          parts.push(`u:${b.kind}`);
        }
      });
      return parts.join("|");
    }

    function renderStructuredContentDom(host, blocks, options) {
      host.innerHTML = "";
      if (options && options.contextCompaction) {
        const shell = document.createElement("div");
        shell.className = "context-compaction-shell";
        host.appendChild(shell);

        const noteBlock = Array.isArray(blocks) ? blocks.find((block) => block && block.kind === "paragraph") : null;
        const detailBlocks = Array.isArray(blocks) ? blocks.filter((block) => block && block !== noteBlock) : [];

        const note = document.createElement("div");
        note.className = "context-compaction-note";
        note.textContent = noteBlock && noteBlock.kind === "paragraph" ? String(noteBlock.text || "").trim() : "已执行上下文下压缩。";
        shell.appendChild(note);

        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "context-compaction-toggle";
        toggle.textContent = "展开摘要";
        shell.appendChild(toggle);

        const body = document.createElement("div");
        body.className = "context-compaction-body";
        body.hidden = true;
        shell.appendChild(body);

        const root = document.createElement("div");
        root.className = "report-root";
        body.appendChild(root);
        renderStructuredBlocksInto(root, detailBlocks);

        toggle.addEventListener("click", () => {
          const willOpen = body.hidden;
          body.hidden = !willOpen;
          toggle.textContent = willOpen ? "收起摘要" : "展开摘要";
        });
        return;
      }
      const root = document.createElement("div");
      root.className = "report-root";
      host.appendChild(root);
      renderStructuredBlocksInto(root, blocks);
    }

    function renderStructuredBlocksInto(root, blocks) {
      const pushSection = (title, tagText, opts) => {
        const section = document.createElement("div");
        section.className = `report-section${opts && opts.full ? " full" : ""}`;
        const head = document.createElement("div");
        head.className = "report-title";
        const h3 = document.createElement("h3");
        h3.textContent = String(title || "").trim() || "内容";
        head.appendChild(h3);
        if (tagText) {
          const tag = document.createElement("span");
          tag.className = "report-tag";
          tag.textContent = String(tagText).trim();
          head.appendChild(tag);
        }
        section.appendChild(head);
        const body = document.createElement("div");
        body.className = "report-text";
        section.appendChild(body);
        root.appendChild(section);
        return { section, body };
      };

      let leadUsed = false;
      (blocks || []).forEach((block) => {
        if (!block || !block.kind) return;
        if (block.kind === "paragraph") {
          const text = String(block.text || "").trim();
          if (!text) return;
          if (leadUsed) {
            const sec = pushSection("补充说明", "说明", { full: true });
            sec.body.textContent = text;
            return;
          }
          const lead = document.createElement("div");
          lead.className = "report-lead";
          lead.textContent = text;
          root.appendChild(lead);
          leadUsed = true;
          return;
        }
        if (block.kind === "section") {
          const sec = pushSection(block.title, "说明", { full: true });
          sec.body.textContent = String(block.text || "").trim();
          return;
        }
        if (block.kind === "kv") {
          const sec = pushSection(block.title || "信息", "概览", { full: false });
          sec.body.className = "report-kv-grid";
          const entries = Array.isArray(block.entries) ? block.entries : [];
          entries.forEach((entry) => {
            if (!entry) return;
            const key = String(entry.key || "").trim();
            const value = String(entry.value || "").trim();
            if (!key && !value) return;
            const item = document.createElement("div");
            item.className = "report-kv-item";
            const k = document.createElement("div");
            k.className = "report-kv-key";
            k.textContent = key || "字段";
            const v = document.createElement("div");
            v.className = "report-kv-value";
            v.textContent = value || "-";
            item.appendChild(k);
            item.appendChild(v);
            sec.body.appendChild(item);
          });
          return;
        }
        if (block.kind === "list") {
          const sec = pushSection(block.title || "列表", "要点", { full: false });
          const ul = document.createElement("ul");
          ul.className = "report-list";
          const items = Array.isArray(block.items) ? block.items : [];
          items.forEach((text) => {
            const line = String(text || "").trim();
            if (!line) return;
            const li = document.createElement("li");
            li.className = "report-li";
            const bullet = document.createElement("div");
            bullet.className = "report-bullet";
            const body = document.createElement("div");
            body.className = "report-li-text";
            body.textContent = line;
            li.appendChild(bullet);
            li.appendChild(body);
            ul.appendChild(li);
          });
          sec.body.innerHTML = "";
          sec.body.appendChild(ul);
          return;
        }
      });
    }

    function syncUI(forceUpdate = false) {
      const state = readState();
      if (!state) return;

      const version = state.__stateVersion || 0;
      // 如果不是强制更新且版本相同，跳过
      if (!forceUpdate && version === lastSeenStateVersion) {
        return;
      }
      lastSeenStateVersion = version;
      currentState = state;
      
       const isRunning = state.agentRunState === "planning" ||
                        state.agentRunState === "running_tools" ||
                        state.agentRunState === "waiting_llm";
       
      if (ENABLE_DEBUG_IFRAME_LOGS) {
        console.log(`${LOG_PREFIX} state.update`, {
          version,
          agentRunState: state.agentRunState,
          isRunning,
          messageCount: state.chatMessages?.length ?? 0,
          streamingCount: state.chatMessages?.filter(m => m.role === "assistant" && m.streaming).length ?? 0,
          forceUpdate,
        });
      }

      // Update session name
      const sessionNameEl = document.getElementById("session-name");
      if (sessionNameEl && state.sessionTitle) {
        sessionNameEl.textContent = state.sessionTitle;
      }

      // Update composer busy state (we don't show a global badge anymore).
      setBusy(Boolean(isRunning));

      // Render messages
      renderChat(state.chatMessages || []);

      syncSettingsPanel(state);
      maybeToast(state);

      // Fallback: while running, poll state in case the host drops a final event.
      if (isRunning) {
        if (!syncTimer) {
          syncTimer = setInterval(() => {
            try { syncUI(false); } catch {}
          }, 250);
        }
        if (!runningTicker) {
          runningTicker = setInterval(() => {
            try { syncUI(true); } catch {}
          }, 1000);
        }
      } else if (syncTimer) {
        clearInterval(syncTimer);
        syncTimer = null;
        if (runningTicker) {
          clearInterval(runningTicker);
          runningTicker = null;
        }
      }
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      if (!toast) return;
      toast.textContent = message;
      toast.classList.add("show");
      if (toastTimer) {
        clearTimeout(toastTimer);
      }
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2000);
    }

    function maybeToast(state) {
      const toast = state.toast;
      if (!toast || !toast.message) return;
      if (toast.id <= lastToastId) return;
      lastToastId = toast.id;
      showToast(toast.message);
    }

    function syncSettingsPanel(state) {
      const setText = (id, value) => {
        const el = document.getElementById(id);
        if (el) el.textContent = value;
      };
      const debugEnabled = localStorage.getItem("lceda_ai.llm.debug_route") === "1";
      setText("settings-login-status", state.loggedIn ? "已登录" : state.loginStatus || "未登录");
      setText("settings-user-name", state.userDisplayName || "游客");
      setText("settings-user-email", state.userEmail || "-");
      setText(
        "settings-credits-balance",
        ((state.creditsBalance ?? 0) + " " + (state.creditsCurrency ?? "")).trim() || "0"
      );
      setText("settings-llm-api-key", state.customLlmConfig?.apiKeyMasked || "-");
      setText("settings-channel", state.channel || "-");
      setText("settings-issues", String(state.issueCount || 0));
      setText("settings-selection", String(state.selectionCount || 0));
      setText("settings-components", String(state.componentCount || 0));
      setText("settings-nets", String(state.netCount || 0));
      if (debugEnabled && state.llmLastRoute) {
        const at = state.llmLastAt ? new Date(state.llmLastAt).toLocaleTimeString() : "-";
        const model = state.llmLastModel || "-";
        setText("settings-llm-last-route", `${state.llmLastRoute} | ${model} | ${at}`);
      } else {
        setText("settings-llm-last-route", debugEnabled ? "等待调用..." : "已关闭");
      }
      setText(
        "settings-llm-mode-hint",
        state.llmMode === "proxy"
          ? "通过本地 LLM 服务转发，请先登录"
          : "使用自定义 OpenAI-compatible 接口，不需要登录"
      );

      const modeSelect = document.getElementById("settings-llm-mode-select");
      if (modeSelect && !modeSelect.__llmModeBound) {
        modeSelect.__llmModeBound = true;
        modeSelect.addEventListener("change", (e) => {
          const mode = e.target && e.target.value;
          if (mode !== "custom" && mode !== "proxy") return;
          invokeRuntime("setLlmMode", { mode });
        });
      }
      if (modeSelect && String(modeSelect.value || "") !== String(state.llmMode || "custom")) {
        modeSelect.value = state.llmMode || "custom";
      }
      const debugToggle = document.getElementById("settings-llm-debug-toggle");
      if (debugToggle && !debugToggle.__llmDebugBound) {
        debugToggle.__llmDebugBound = true;
        debugToggle.addEventListener("change", (e) => {
          const checked = Boolean(e.target && e.target.checked);
          localStorage.setItem("lceda_ai.llm.debug_route", checked ? "1" : "0");
          syncUI();
        });
      }
      if (debugToggle) {
        debugToggle.checked = debugEnabled;
      }

      const providerInput = document.getElementById("settings-llm-provider-input");
      const baseUrlInput = document.getElementById("settings-llm-base-url-input");
      const modelInput = document.getElementById("settings-llm-model-input");
      if (providerInput && !providerInput.value) providerInput.value = state.customLlmConfig?.provider || "";
      if (baseUrlInput && !baseUrlInput.value) baseUrlInput.value = state.customLlmConfig?.baseUrl || "";
      if (modelInput && !modelInput.value) modelInput.value = state.customLlmConfig?.model || "";
    }

    // Event Listeners
    document.getElementById("send-btn").addEventListener("click", () => {
      const input = document.getElementById("chat-input");
      const text = input.value.trim();
      console.log(`${LOG_PREFIX} send button clicked`, { text, isBusy });
      if (!text || isBusy) return;
      sendPrompt(text);
    });

    document.getElementById("chat-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        document.getElementById("send-btn").click();
      }
    });

    document.getElementById("new-session-btn").addEventListener("click", () => {
      invokeRuntime("resetSession");
    });

    document.getElementById("close-session-btn").addEventListener("click", () => {
      invokeRuntime("resetSession");
    });

    const settingsDrawer = document.getElementById("settings-drawer");
    const settingsOverlay = document.getElementById("settings-overlay");
    const settingsCloseBtn = document.getElementById("settings-close-btn");

    function setSettingsOpen(open) {
      if (!settingsDrawer || !settingsOverlay) return;
      settingsDrawer.classList.toggle("open", open);
      settingsOverlay.classList.toggle("open", open);
      settingsDrawer.setAttribute("aria-hidden", open ? "false" : "true");
      settingsOverlay.setAttribute("aria-hidden", open ? "false" : "true");
      if (open) {
        invokeRuntime("syncState");
      }
    }

    document.getElementById("settings-btn").addEventListener("click", () => {
      setSettingsOpen(true);
    });

    settingsCloseBtn.addEventListener("click", () => setSettingsOpen(false));
    settingsOverlay.addEventListener("click", () => setSettingsOpen(false));

    document.getElementById("settings-login-button").addEventListener("click", () => {
      invokeRuntime("startLogin");
    });

    document.getElementById("settings-llm-save-button").addEventListener("click", () => {
      invokeRuntime("saveCustomLlmConfig", {
        provider: document.getElementById("settings-llm-provider-input").value,
        baseUrl: document.getElementById("settings-llm-base-url-input").value,
        model: document.getElementById("settings-llm-model-input").value,
        apiKey: document.getElementById("settings-llm-api-key-input").value,
      });
    });

    document.getElementById("attach-btn").addEventListener("click", () => {
      document.getElementById("file-input").click();
    });

    document.getElementById("file-input").addEventListener("change", (e) => {
      const files = Array.from(e.target.files || []);
      if (files.length > 0) {
        console.log(`${LOG_PREFIX} files attached:`, files.length);
        // File attachment not implemented yet
      }
    });

    // Listen for state updates
    window.addEventListener("lceda-ai-assistant:state", () => {
      syncUI();
    });

    // Wait for runtime to be injected
    function waitForRuntime() {
      const runtime = getHostRuntime();
      const state = readState();
      
      if (runtime && state) {
        console.log(`${LOG_PREFIX} runtime ready`, {
          hasRuntime: true,
          messageCount: state.chatMessages?.length ?? 0,
        });
        
        // Initial sync
        syncUI();
        
        return;
      }
      
      // Keep waiting
      setTimeout(waitForRuntime, 100);
    }
    
    // Start waiting
    console.log(`${LOG_PREFIX} UI initialized, waiting for runtime...`);
    bindAutoScroll();
    waitForRuntime();

    // Settings polling removed: it caused duplicate renders during streaming.
})();
  </script>

  <!-- Load runtime initialization script -->
