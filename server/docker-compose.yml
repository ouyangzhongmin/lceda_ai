services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    container_name: lceda-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lceda_ai
      POSTGRES_USER: lceda
      POSTGRES_PASSWORD: lceda_dev_password
      TZ: Asia/Shanghai
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lceda -d lceda_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: lceda-ai-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "lceda_redis_dev_password"]
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "lceda_redis_dev_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: lceda_ai_network
